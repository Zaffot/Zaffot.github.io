<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">PadelPoints</title>
  <desc id="desc">Tyylitelty padelkenttä ja pistetilanne</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d18"/>
      <stop offset="1" stop-color="#123f32"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#79f59f" stroke-width="5" opacity=".9">
    <rect x="65" y="58" width="470" height="284" rx="18"/>
    <path d="M300 58v284M65 200h470M183 58v284M417 58v284" opacity=".55"/>
  </g>
  <circle cx="300" cy="200" r="18" fill="#dfff55" filter="url(#glow)"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="300" y="37" fill="#f1fff4" font-size="25" font-weight="800" letter-spacing="4">PADELPOINTS</text>
    <text x="195" y="189" fill="#42d9ff" font-size="82" font-weight="900">40</text>
    <text x="405" y="189" fill="#ff5f76" font-size="82" font-weight="900">30</text>
    <text x="195" y="228" fill="#b9d9d0" font-size="18" font-weight="700">TIIMI A</text>
    <text x="405" y="228" fill="#b9d9d0" font-size="18" font-weight="700">TIIMI B</text>
    <text x="300" y="382" fill="#dfff55" font-size="18" font-weight="800">PELAA · SEURAA · KEHITY</text>
  </g>
</svg>
